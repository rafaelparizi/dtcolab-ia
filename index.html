<!DOCTYPE html>
<html lang="pt-pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTColab + IA - Infográfico</title>
    <!-- Tailwind CSS para estilização -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React e ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX no navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        // Uso de IIFE para evitar conflitos de escopo global e erros de re-declaração
        (() => {
            const { useState, Fragment } = React;

            // Acesso seguro ao objeto global lucideReact
            const icons = window.lucideReact || {};
            const {
                Search, Target, Cpu, Share2, Users, FileText,
                ChevronRight, Info, CheckCircle2, Circle,
                ExternalLink, Eye, X, Play, Rocket, Flag,
                Coffee, Clock
            } = icons;

            const App = () => {
                const [activePhase, setActivePhase] = useState(null);
                const [completedActions, setCompletedActions] = useState({});
                const [showExample, setShowExample] = useState(null);

                const phases = [
                    {
                        id: 'abertura',
                        title: 'Desafio',
                        type: 'Preparação',
                        time: '20 min',
                        color: 'bg-slate-500',
                        borderColor: 'border-slate-500',
                        icon: Rocket ? <Rocket className="w-6 h-6" /> : null,
                        shape: 'circle',
                        tools: [],
                        actions: [
                            'Alinhamento inicial com as equipes',
                            'Apresentação do Desafio Macro',
                            'Apresentação do framework DTColab'
                        ],
                        examples: [
                            'Organização: Identificar o Líder da equipe seguindo as orientações do Facilitador.',
                            'Desafio: Como transformar dados públicos dispersos sobre gastos governamentais em informação compreensível, útil e fiscalizável pela sociedade?',
                            'Explicação: Entender que o desafio macro é ponto de partida para descoberta de um problema real a ser trabalhado nas etapas seguintes.'
                        ],
                        collaboration: 'Alinhamento de expectativas e conexão entre os membros do grupo.',
                        description: 'Apresentação da Metodologia DTColab e Formação de Grupos Multidisciplinares.',
                        aiExplanation: 'Esta é uma Etapa puramente humana para estabelecer as bases da colaboração.'
                    },
                    {
                        id: 'descoberta',
                        title: '1. Descoberta',
                        type: 'Divergir',
                        time: '20 min',
                        color: 'bg-red-500',
                        borderColor: 'border-red-500',
                        icon: Search ? <Search className="w-6 h-6" /> : null,
                        shape: 'diamond',
                        tools: [{ name: 'Gemini', url: 'https://gemini.google.com/' }],
                        actions: [
                            'Pesquisa e Exploração "Desk"',
                            'Investigação de cenários em instituições globais e brasileiras',
                            'Elaboração de exemplos de boas práticas e riscos'
                        ],
                        examples: [
                            'Prompt: "Atue como assistente de pesquisa. Me ajude com..."',
                            'Ação: Buscar por "AI in Education report 2024" para coletar dados reais.',
                            'Prompt: "Atue como assistente de pesquisa. Me ajude com..."'
                        ],
                        collaboration: 'Discussões sobre os achados e organização das informações coletadas.',
                        description: 'Investigação profunda sobre como a educação está lidando com a IA no mundo real.',
                        aiExplanation: 'O Gemini atua como assistente de pesquisa para elaborar cenários, exemplos de boas práticas e riscos.'
                    },
                    {
                        id: 'definicao',
                        title: '2. Definição',
                        type: 'Convergir',
                        time: '20 min',
                        color: 'bg-yellow-500',
                        borderColor: 'border-yellow-500',
                        icon: Target ? <Target className="w-6 h-6" /> : null,
                        shape: 'diamond',
                        tools: [{ name: 'NotebookLM', url: 'https://notebooklm.google.com/' }],
                        actions: [
                            'Agrupamento e estruturação dos achados da Etapa 1',
                            'Identificação do desafio real/problema”',
                            'Criação da "frase-problema" norteadora'
                        ],
                        examples: [
                            'Ação: Fazer upload dos textos da etapa 1 no NotebookLM.',
                            'Definição: "Como transformar dados públicos dispersos sobre gastos governamentais em informação compreensível, útil e fiscalizável pela sociedade?"',
                            'Frase-Problema: Formar uma frase que declare o problema (no formato de pergunta) a ser trabalhado pela equipe. Por exemplo: “Como facilitar a comunicação entre cidadãos e órgãos de segurança pública para relatar alguma situação de perigo ou pedir ajuda?”'
                        ],
                        collaboration: 'Consenso sobre qual problema específico o grupo deseja atacar.',
                        description: 'Estruturação de problemas e definição do desafio real a ser solucionado.',
                        aiExplanation: 'O NotebookLM processa os achados da pesquisa inicial para ajudar a definir a frase-problema baseada em dados.'
                    },
                    {
                        id: 'desenvolvimento',
                        title: '3. Desenvolvimento',
                        type: 'Divergir',
                        time: '180 min',
                        color: 'bg-green-500',
                        borderColor: 'border-green-500',
                        icon: Cpu ? <Cpu className="w-6 h-6" /> : null,
                        shape: 'diamond',
                        tools: [{ name: 'Gemini Canvas', url: 'https://gemini.google.com/' }],
                        actions: [
                            'Pensar fora da caixa (até mesmo sem caixas)',
                            'Construção do protótipo da solução',
                            // 'Redação dos guias de implementação',
                            'Intervalo de 20 minutos (no meio da atividade)'
                        ],
                        examples: [
                            'Brainstorming: Todos devem gerar ideias (pensar fora da caixa) para solucionar o problema definido na etapa anterior. No final, a equipe deve coletar, categorizar, refinar e selecionar as melhores, mais práticas e inovadoras dentre as ideias geradas.',
                            'Dica: Use o Gemini para sugerir um protótipo de solução com as ideias geradas pela equipe.',
                            // 'Check: A solução resolve diretamente a frase-problema da etapa anterior?'
                            'Hora de exercitar o corpo e fazer um lanche'
                        ],
                        collaboration: 'Mão na massa coletivo para construir o protótipo e a lógica da solução.',
                        description: 'Produção da Solução (Mão na Massa) e configuração da lógica de funcionamento.',
                        aiExplanation: 'Utiliza-se o Gemini Canvas para construir a protótipo, configurar a lógica e redigir guias.'
                    },
                    {
                        id: 'entrega',
                        title: '4. Entrega',
                        type: 'Convergir',
                        time: '60 min',
                        color: 'bg-blue-600',
                        borderColor: 'border-blue-600',
                        icon: Share2 ? <Share2 className="w-6 h-6" /> : null,
                        shape: 'diamond',
                        tools: [{ name: 'NotebookLM', url: 'https://notebooklm.google.com/' }],
                        actions: [
                            'Finalização da solução proposta',
                            'Preparação do Pitch',
                            'Preparação da Apresentação'
                        ],
                        examples: [
                            'NotebookLM: "Resuma nosso projeto em 3 tópicos de impacto para um pitch de 5 minutos."',
                            'Atue como um especialista em inovação e comunicação persuasiva. Crie um guia claro, objetivo e bem estruturado com os principais pontos que devem compor um pitch de 5 minutos sobre um problema identificado e uma solução desenvolvida por meio do Design Thinking.',
                            'Apresentação: preparar a apresentação com o conteúdo gerado para o Pitch no item anterior. Usar a ferramenta de IA de sua preferência para gerar a apresentação no formato de pitch.'
                        ],
                        collaboration: 'Refinamento do discurso de apresentação para garantir clareza e impacto.',
                        description: 'Finalização da solução e preparação do Pitch de soluções.',
                        aiExplanation: 'O NotebookLM ajudará a resumir os pontos-chave e a criar roteiros de impacto para a apresentação.'
                    },
                    {
                        id: 'conclusao',
                        title: 'Apresentação',
                        type: 'Apresentação',
                        time: '60 min',
                        color: 'bg-indigo-700',
                        borderColor: 'border-indigo-700',
                        icon: Flag ? <Flag className="w-6 h-6" /> : null,
                        shape: 'circle',
                        tools: [],
                        actions: [
                            'Apresentação dos pitches (3 min apresentação + 2 min perguntas)',
                            'Avaliação das soluções',
                            'Feedback final e encerramento',
                            'Entrega da Solução'
                        ],
                        examples: [
                            'Apresentação: Mostrar o protótipo/fluxo criado e defender a solução!',
                            'Avaliação: as soluções serão avaliadas por uma comissão julgadora formada por 3 profissionais relacionados ao tema do desafio e tecnologias colaborativas.',
                            'Percepção do cliente sobre as soluções apresentadas e divulgação da(s) equipe(s) vencedoras.',
                            'Entrega: Preencher o formulário de entrega com as informações solicitadas, incluindo arquivo com print das telas da solução e link de onde se encontra a solução proposta pela equipe. Acesse o formulário no link informado pelo Facilitador.'
                        ],
                        collaboration: 'Validação das soluções com a banca avaliadora',
                        description: 'Apresentação Final (Pitch) e Debate sobre soluções inovadoras.',
                        aiExplanation: 'Etapa de validação humana e debate crítico sobre os resultados alcançados.'
                    }
                ];

                const toggleAction = (phaseId, actionIndex) => {
                    setCompletedActions(prev => ({
                        ...prev,
                        [phaseId]: {
                            ...prev[phaseId],
                            [actionIndex]: !prev[phaseId]?.[actionIndex]
                        }
                    }));
                };

                return (
                    <div className="min-h-screen bg-slate-50 p-4 md:p-8 text-slate-800">
                        <div className="max-w-6xl mx-auto">
                            <header className="text-center mb-12">
                                <h1 className="text-4xl font-extrabold text-slate-900 mb-2 tracking-tight uppercase">DTColab + IA</h1>
                                <p className="text-lg text-slate-600 max-w-2xl mx-auto italic">
                                    Design Thinking e IA Generativa para Inovação.
                                </p>
                                <div class="mt-6 max-w-2xl mx-auto">
                                    <div class="bg-white border border-slate-200 border-l-4 border-l-green-700 rounded-2xl p-6 text-left shadow-sm">
                                        <div class="flex items-start gap-3">
                                            <div class="w-10 h-10 rounded-xl bg-green-50 flex items-center justify-center shrink-0">
                                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3B6D11" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12" /></svg>
                                            </div>
                                            <div class="flex-1">
                                                <p class="text-[11px] font-bold text-green-700 uppercase tracking-widest mb-1">MaratonaColab - SBSC 2026</p>
                                                <p>Competição gratuita realizada no Simpósio Brasileiro de Sistemas Colaborativos (SBSC), conduzida pela abordagem de Design Thinking, na qual equipes são desafiadas a propor soluções inovadoras para problemas reais utilizando sistemas colaborativos.</p>


                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </header>

                            <div className="relative mb-16 px-4">
                                {/* Seta de sequência — fica atrás de tudo */}
                                <div className="hidden md:block absolute inset-x-0" style={{top:'50%', transform:'translateY(-50%)', zIndex:0, pointerEvents:'none', padding:'0 80px'}}>
                                    <svg width="100%" height="28" viewBox="0 0 1000 28" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <defs>
                                            <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                                <stop offset="0%" stopColor="#94a3b8" stopOpacity="0.5"/>
                                                <stop offset="100%" stopColor="#94a3b8" stopOpacity="0.6"/>
                                            </linearGradient>
                                        </defs>
                                        <line x1="4" y1="14" x2="1000" y2="14" stroke="url(#arrowGrad)" strokeWidth="10" strokeLinecap="round"/>
                                    </svg>
                                </div>

                                <div className="flex flex-col md:flex-row items-center justify-center gap-4 md:gap-0">
                                    {/* Desafio */}
                                    <button onClick={() => setActivePhase(phases[0])} style={{zIndex: activePhase?.id === phases[0].id ? 30 : 8}} className={`relative group transition-all duration-300 transform ${activePhase?.id === phases[0].id ? 'scale-110' : 'hover:scale-105'} w-full md:w-40 h-40 flex flex-col items-center justify-center`}>
                                        <div className={`absolute inset-0 transition-colors duration-300 ${activePhase?.id === phases[0].id ? phases[0].color : 'bg-white'} border-4 ${phases[0].borderColor} shadow-lg rounded-full scale-75 overflow-hidden`}></div>
                                        <div className={`relative flex flex-col items-center justify-center p-2 text-center ${activePhase?.id === phases[0].id ? 'text-white' : 'text-slate-700'}`}>
                                            {phases[0].icon}
                                            <span className="font-bold text-xs md:text-sm mt-1">{phases[0].title}</span>
                                            <div className="flex items-center gap-1 mt-1">{Clock && <Clock className="w-3 h-3 opacity-60" />}<span className="text-[10px] font-black uppercase tracking-tighter">{phases[0].time}</span></div>
                                        </div>
                                    </button>

                                    {/* Seta 1 */}
                                    <div className="hidden md:flex items-center" style={{flexShrink:0, marginLeft:'16px', marginRight:'32px', zIndex:7}}>
                                        <svg width="52" height="44" viewBox="0 0 52 44" fill="none"><polygon points="0,0 36,0 52,22 36,44 0,44 16,22" fill="#1e3a5f"/></svg>
                                    </div>

                                    {/* Diamante 1: Descoberta + Definição */}
                                    <div className="hidden md:block relative" style={{width:'200px', height:'200px', flexShrink:0, zIndex:6, overflow:'visible'}}>
                                        {/* SVG maior (260×260) centralizado via margem negativa — texto nunca sai do viewport */}
                                        <svg width="260" height="260" viewBox="0 0 260 260" style={{display:'block', position:'absolute', top:'-30px', left:'-30px', overflow:'visible'}}>
                                            {/* Grupo esquerdo: Descoberta — escala saindo pela ponta esquerda */}
                                            <g onClick={()=>setActivePhase(phases[1])} style={{cursor:'pointer', transition:'transform 0.3s', transform: activePhase?.id===phases[1].id?'scale(1.13)':'scale(1)', transformOrigin:'130px 130px'}}>
                                                <path d="M 38.5,121.5 Q 30,130 38.5,138.5 L 121.5,221.5 Q 130,230 130,218 L 130,42 Q 130,30 121.5,38.5 Z" fill={activePhase?.id===phases[1].id?'#ef4444':'#fee2e2'} stroke="#ef4444" strokeWidth="2.5"/>
                                                <text x="80" y="62" textAnchor="middle" dominantBaseline="middle" transform="rotate(-45,80,80)" fontSize="13" fontWeight="800" fill={activePhase?.id===phases[1].id?'white':'#ef4444'}>{phases[1].title}</text>
                                                <text x="80" y="130" textAnchor="middle" dominantBaseline="middle" fontSize="10" fontWeight="900" fill={activePhase?.id===phases[1].id?'white':'#b91c1c'}>{phases[1].time}</text>
                                            </g>
                                            {/* Grupo direito: Definição — escala saindo pela ponta direita */}
                                            <g onClick={()=>setActivePhase(phases[2])} style={{cursor:'pointer', transition:'transform 0.3s', transform: activePhase?.id===phases[2].id?'scale(1.13)':'scale(1)', transformOrigin:'130px 130px'}}>
                                                <path d="M 138.5,38.5 Q 130,30 130,42 L 130,218 Q 130,230 138.5,221.5 L 221.5,138.5 Q 230,130 221.5,121.5 Z" fill={activePhase?.id===phases[2].id?'#eab308':'#fef3c7'} stroke="#eab308" strokeWidth="2.5"/>
                                                <text x="180" y="62" textAnchor="middle" dominantBaseline="middle" transform="rotate(45,180,80)" fontSize="13" fontWeight="800" fill={activePhase?.id===phases[2].id?'white':'#d97706'}>{phases[2].title}</text>
                                                <text x="180" y="130" textAnchor="middle" dominantBaseline="middle" fontSize="10" fontWeight="900" fill={activePhase?.id===phases[2].id?'white':'#92400e'}>{phases[2].time}</text>
                                            </g>
                                            <line x1="130" y1="33" x2="130" y2="227" stroke="white" strokeWidth="2" style={{pointerEvents:'none'}}/>
                                        </svg>
                                    </div>

                                    {/* ! Problema definido */}
                                    <div className="hidden md:flex flex-col items-center" style={{position:'relative', zIndex:25, margin:'0 16px', flexShrink:0}}>
                                        <div className="flex items-center justify-center w-8 h-8 rounded-full bg-slate-800 text-white font-bold ring-4 ring-white" style={{fontSize:'16px'}}>!</div>
                                        <svg width="12" height="44" viewBox="0 0 12 44" className="mt-1">
                                            <line x1="6" y1="0" x2="6" y2="36" stroke="#475569" strokeWidth="2"/>
                                            <polygon points="2,36 10,36 6,44" fill="#475569"/>
                                        </svg>
                                        <span className="text-[9px] font-black text-slate-600 uppercase tracking-widest text-center leading-tight whitespace-nowrap">Problema<br/>definido</span>
                                    </div>

                                    {/* Diamante 2: Desenvolvimento + Entrega */}
                                    <div className="hidden md:block relative" style={{width:'200px', height:'200px', flexShrink:0, zIndex:4, overflow:'visible'}}>
                                        <svg width="260" height="260" viewBox="0 0 260 260" style={{display:'block', position:'absolute', top:'-30px', left:'-30px', overflow:'visible'}}>
                                            {/* Grupo esquerdo: Desenvolvimento */}
                                            <g onClick={()=>setActivePhase(phases[3])} style={{cursor:'pointer', transition:'transform 0.3s', transform: activePhase?.id===phases[3].id?'scale(1.13)':'scale(1)', transformOrigin:'130px 130px'}}>
                                                <path d="M 38.5,121.5 Q 30,130 38.5,138.5 L 121.5,221.5 Q 130,230 130,218 L 130,42 Q 130,30 121.5,38.5 Z" fill={activePhase?.id===phases[3].id?'#22c55e':'#dcfce7'} stroke="#22c55e" strokeWidth="2.5"/>
                                                <text x="80" y="62" textAnchor="middle" dominantBaseline="middle" transform="rotate(-45,80,80)" fontSize="13" fontWeight="800" fill={activePhase?.id===phases[3].id?'white':'#16a34a'}>{phases[3].title}</text>
                                                <text x="80" y="130" textAnchor="middle" dominantBaseline="middle" fontSize="10" fontWeight="900" fill={activePhase?.id===phases[3].id?'white':'#14532d'}>{phases[3].time}</text>
                                            </g>
                                            {/* Grupo direito: Entrega */}
                                            <g onClick={()=>setActivePhase(phases[4])} style={{cursor:'pointer', transition:'transform 0.3s', transform: activePhase?.id===phases[4].id?'scale(1.13)':'scale(1)', transformOrigin:'130px 130px'}}>
                                                <path d="M 138.5,38.5 Q 130,30 130,42 L 130,218 Q 130,230 138.5,221.5 L 221.5,138.5 Q 230,130 221.5,121.5 Z" fill={activePhase?.id===phases[4].id?'#2563eb':'#dbeafe'} stroke="#2563eb" strokeWidth="2.5"/>
                                                <text x="180" y="62" textAnchor="middle" dominantBaseline="middle" transform="rotate(45,180,80)" fontSize="13" fontWeight="800" fill={activePhase?.id===phases[4].id?'white':'#2563eb'}>{phases[4].title}</text>
                                                <text x="180" y="130" textAnchor="middle" dominantBaseline="middle" fontSize="10" fontWeight="900" fill={activePhase?.id===phases[4].id?'white':'#1e3a8a'}>{phases[4].time}</text>
                                            </g>
                                            <line x1="130" y1="33" x2="130" y2="227" stroke="white" strokeWidth="2" style={{pointerEvents:'none'}}/>
                                        </svg>
                                    </div>

                                    {/* Seta 2 */}
                                    <div className="hidden md:flex items-center" style={{flexShrink:0, marginLeft:'32px', marginRight:'16px', zIndex:3}}>
                                        <svg width="52" height="44" viewBox="0 0 52 44" fill="none"><polygon points="0,0 36,0 52,22 36,44 0,44 16,22" fill="#1e3a5f"/></svg>
                                    </div>

                                    {/* Apresentação */}
                                    <button onClick={() => setActivePhase(phases[5])} style={{zIndex: activePhase?.id === phases[5].id ? 30 : 2}} className={`relative group transition-all duration-300 transform ${activePhase?.id === phases[5].id ? 'scale-110' : 'hover:scale-105'} w-full md:w-40 h-40 flex flex-col items-center justify-center`}>
                                        <div className={`absolute inset-0 transition-colors duration-300 ${activePhase?.id === phases[5].id ? phases[5].color : 'bg-white'} border-4 ${phases[5].borderColor} shadow-lg rounded-full scale-75 overflow-hidden`}></div>
                                        <div className={`relative flex flex-col items-center justify-center p-2 text-center ${activePhase?.id === phases[5].id ? 'text-white' : 'text-slate-700'}`}>
                                            {phases[5].icon}
                                            <span className="font-bold text-xs md:text-sm mt-1">{phases[5].title}</span>
                                            <div className="flex items-center gap-1 mt-1">{Clock && <Clock className="w-3 h-3 opacity-60" />}<span className="text-[10px] font-black uppercase tracking-tighter">{phases[5].time}</span></div>
                                        </div>
                                    </button>
                                </div>
                                <div className="hidden md:flex justify-between mt-10 text-[10px] font-black text-slate-400 uppercase tracking-widest px-24">
                                    <div className="flex-1 text-center border-b-2 border-slate-200 pb-1 mr-4">Investigação</div>
                                    <div className="flex-1 text-center border-b-2 border-slate-200 pb-1 ml-4">Criação</div>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                {activePhase ? (
                                    <>
                                        <div className="lg:col-span-2 bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
                                            <div className="flex items-center gap-3 mb-6">
                                                <div className={`p-3 rounded-xl ${activePhase.color} text-white shadow-lg`}>
                                                    {activePhase.icon}
                                                </div>
                                                <div>
                                                    <h2 className="text-2xl font-bold">{activePhase.title}</h2>
                                                    <div className="flex items-center gap-2 text-slate-500">
                                                        {Clock && <Clock className="w-4 h-4" />}
                                                        <span className="text-sm font-bold">{activePhase.time}</span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="space-y-6">
                                                <div>
                                                    <h3 className="flex items-center gap-2 font-bold text-slate-800 mb-4 uppercase text-sm tracking-widest">
                                                        {FileText && <FileText className="w-4 h-4 text-blue-500" />} Checklist de Atividades
                                                    </h3>
                                                    <ul className="space-y-3">
                                                        {activePhase.actions.map((action, i) => {
                                                            const isDone = completedActions[activePhase.id]?.[i];
                                                            const hasBreak = action.toLowerCase().includes('intervalo');
                                                            return (
                                                                <li key={i} className={`flex items-center justify-between gap-3 p-3 rounded-xl border transition-all ${hasBreak ? 'bg-amber-50 border-amber-200' : 'border-slate-100 bg-slate-50/50 hover:border-slate-300'
                                                                    }`}>
                                                                    <div onClick={() => toggleAction(activePhase.id, i)} className="flex items-center gap-3 cursor-pointer flex-1">
                                                                        {isDone ? (
                                                                            CheckCircle2 && <CheckCircle2 className={`w-6 h-6 shrink-0 ${activePhase.color.replace('bg-', 'text-')}`} />
                                                                        ) : hasBreak ? (
                                                                            Coffee && <Coffee className="w-6 h-6 shrink-0 text-amber-500" />
                                                                        ) : (
                                                                            Circle && <Circle className="w-6 h-6 shrink-0 text-slate-300" />
                                                                        )}
                                                                        <span className={`text-sm md:text-base ${isDone ? 'line-through opacity-40 italic' : 'font-medium'}`}>
                                                                            {action}
                                                                        </span>
                                                                    </div>
                                                                    <button
                                                                        onClick={() => setShowExample({ title: action, text: activePhase.examples[i] })}
                                                                        className="flex items-center gap-1 px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-bold text-slate-600 hover:bg-slate-100 shadow-sm"
                                                                    >
                                                                        {Eye && <Eye className="w-3 h-3" />} Exemplo
                                                                    </button>
                                                                </li>
                                                            );
                                                        })}
                                                    </ul>
                                                </div>
                                                <div className="p-4 bg-indigo-50 border border-indigo-100 rounded-xl">
                                                    <h3 className="flex items-center gap-2 font-bold text-indigo-900 mb-2">
                                                        {Users && <Users className="w-5 h-5" />} Foco na Colaboração
                                                    </h3>
                                                    <p className="text-indigo-800 text-sm italic">{activePhase.collaboration}</p>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="space-y-6">
                                            <div className="bg-slate-900 rounded-2xl shadow-xl p-8 text-white relative overflow-hidden">
                                                <div className="absolute top-0 right-0 p-4 opacity-10">
                                                    {Cpu && <Cpu className="w-16 h-16" />}
                                                </div>
                                                <h3 className="text-xl font-bold mb-6 flex items-center gap-2 underline decoration-blue-500 underline-offset-8">
                                                    Ecossistema IA
                                                </h3>
                                                <div className="space-y-4">
                                                    {activePhase.tools.length > 0 ? (
                                                        activePhase.tools.map((tool, i) => (
                                                            <a key={i} href={tool.url} target="_blank" rel="noopener noreferrer"
                                                                className="flex items-center justify-between p-4 bg-white/10 rounded-xl border border-white/5 hover:bg-white/20 transition-all group">
                                                                <div className="flex items-center gap-4">
                                                                    <div className="w-10 h-10 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-400 font-bold">{tool.name.charAt(0)}</div>
                                                                    <span className="font-semibold">{tool.name}</span>
                                                                </div>
                                                                {ExternalLink && <ExternalLink className="w-4 h-4 text-slate-500 group-hover:text-blue-400" />}
                                                            </a>
                                                        ))
                                                    ) : (
                                                        <div className="p-4 border border-white/10 rounded-xl text-slate-400 text-center text-sm italic">
                                                            Não aplicável nesta Etapa.
                                                        </div>
                                                    )}
                                                </div>
                                                {activePhase.tools.length > 0 && (
                                                    <div className="mt-8 p-4 bg-blue-500/10 rounded-xl border border-blue-500/20">
                                                        <p className="text-xs text-blue-300 uppercase tracking-wider font-black mb-2">Prompt Sugerido</p>
                                                        <p className="text-sm italic text-slate-300 leading-relaxed font-serif">
                                                            "{activePhase.id === 'descoberta' ? 'Atue como assistente de pesquisa. Liste exemplos de boas práticas sobre [informe o assunto que deseja continuar]...' :
                                                                activePhase.id === 'definicao' ? 'Com base nos materiais, qual o desafio real indicado?' :
                                                                    activePhase.id === 'desenvolvimento' ? 'Construa a arquitetura da solução baseada em...' :
                                                                        'Resuma os pontos-chave em tópicos de pitch...'}"
                                                        </p>
                                                    </div>
                                                )}
                                            </div>
                                            <div className="bg-white rounded-2xl shadow-lg p-6 border-l-8 border-blue-500">
                                                <h3 className="text-xs font-black text-slate-400 uppercase mb-2">Papel da IA no Fluxo</h3>
                                                <p className="text-sm text-slate-700 leading-relaxed font-medium">{activePhase.aiExplanation}</p>
                                            </div>
                                        </div>
                                    </>
                                ) : (
                                    <div className="col-span-1 lg:col-span-3 bg-white rounded-2xl border-2 border-dashed border-slate-200 p-12 text-center">
                                        {Info && <Info className="w-12 h-12 text-slate-300 mx-auto mb-4" />}
                                        <h2 className="text-xl font-bold text-slate-400 italic underline decoration-slate-200 decoration-4">Selecione uma etapa no diagrama acima</h2>
                                        <p className="text-slate-400 mt-2">Navegue pelas Etapas do Framework DTColab + IA.</p>
                                    </div>
                                )}
                            </div>

                            {showExample && (
                                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                                    <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-200 animate-in fade-in zoom-in duration-200">
                                        <div className="bg-slate-50 p-6 flex justify-between items-start border-b border-slate-100">
                                            <h3 className="text-lg font-bold text-slate-800 pr-8 leading-tight">{showExample.title}</h3>
                                            <button onClick={() => setShowExample(null)} className="text-slate-400 hover:text-slate-600 p-1 transition-colors">{X && <X className="w-6 h-6" />}</button>
                                        </div>
                                        <div className="p-8">
                                            <div className="flex items-center gap-2 text-blue-600 font-bold text-sm mb-4 uppercase tracking-widest">{Play && <Play className="w-4 h-4 fill-current" />} Dica & Exemplo</div>
                                            <div className="bg-blue-50/50 p-6 rounded-xl text-slate-700 leading-relaxed border border-blue-100 font-medium whitespace-pre-wrap">
                                                {showExample.text}
                                            </div>
                                        </div>
                                        <div className="px-8 py-4 bg-slate-50 text-right">
                                            <button onClick={() => setShowExample(null)} className="px-6 py-2 bg-slate-800 text-white rounded-lg font-bold hover:bg-slate-700 transition-colors">Fechar</button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            <div className="mt-12 flex flex-wrap justify-center gap-6 text-sm text-slate-400 font-bold uppercase tracking-widest">
                                <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-slate-500" /> Início</div>
                                <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-red-500" /> Pesquisa</div>
                                <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-yellow-500" /> Síntese</div>
                                <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-green-500" /> Protótipo</div>
                                <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-blue-600" /> Pitch</div>
                                <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-indigo-700" /> Encerramento</div>
                            </div>
                        </div>
                        <div class="mt-4">
                            <a href="sobre.html" class="text-blue-500 hover:underline flex items-center gap-2 justify-center" target="blank">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                                Ver documentação da aplicação
                            </a>
                        </div>
                    </div>
                );
            };

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        })();
    </script>
</body>

</html>
